server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Entry point la tour.html (khong co index.html)
    index tour.html;

    # Nen cho file text
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    sendfile on;
    tcp_nopush on;
    # Pano/glb la file lon -> cho tai on dinh
    keepalive_timeout 65;

    # Trang chu -> tour.html
    location = / {
        try_files /tour.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # (Hien tour chua co file .glb - giu san cho model 3D sau nay)
    # .glb khong co trong mime.types mac dinh -> khai bao dung MIME cho model-viewer
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Asset tinh (khong doi ten thi cache dai). Doi ten file/them ?v= khi can bust.
    location ~* \.(webp|jpe?g|png|gif|mp3|ogg|woff2?|ttf|eot|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML/JS/XML dieu khien -> khong cache lau de cap nhat ngay
    location ~* \.(html|xml|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Chan truy cap file cau hinh / noi bo neu vo tinh nam trong web root
    location ~* \.(conf|ya?ml|bak|xlsx|md)$ {
        deny all;
    }

    # Chan Dockerfile va cac file khong duoi (khong extension) nhay cam
    location ~* /(Dockerfile|docker-compose) {
        deny all;
    }

    # Chan moi dotfile / dotfolder (.git, .dockerignore, .env...)
    location ~ /\. {
        deny all;
    }
}