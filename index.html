<body>
<script src="index.js"></script>

<div id="pano" style="width:100%;height:100%;">
	<noscript><table style="width:100%;height:100%;"><tr style="vertical-align:middle;"><td><div style="text-align:center;">ERROR:<br/><br/>Javascript not activated<br/><br/></div></td></tr></table></noscript>
	<script>
		// Dang phat trien: them dau thoi gian de trinh duyet khong dung ban XML cu.
		// Truoc khi dua tour len that thi doi lai thanh  xml:"index.xml"
		// Bien giu doi tuong krpano, dung cho getKrpano() ben duoi.
		var krpano = null;

		embedpano({
			xml: "index.xml?v=" + Date.now(),
			target: "pano",
			html5: "only",
			mobilescale: 1.0,
			passQueryParameters: "startscene,startlookat,devmode",
			onready: function(kr) { krpano = kr; }
		});

		// Lay doi tuong krpano tu Javascript.
		//   getKrpano().get("xml.scene")
		//   getKrpano().set("layer[minimap_box].visible", false)
		//   getKrpano().call("loadscene(scene_matdat_01)")
		// Tra ve null neu goi truoc khi viewer san sang.
		function getKrpano() {
			if (!krpano) {
				krpano = document.getElementById("krpanoSWFObject");
			}
			return krpano || null;
		}

		// Chay ham sau khi viewer da san sang. Dung cai nay thay vi goi
		// getKrpano() ngay luc trang vua tai - luc do viewer chua ton tai.
		function whenKrpanoReady(fn) {
			if (getKrpano()) { fn(getKrpano()); return; }
			var t = setInterval(function () {
				if (getKrpano()) { clearInterval(t); fn(getKrpano()); }
			}, 100);
		}
	</script>
</div>
<script>
		   
		    
	 function remove_watermark() {
	      const layer = getKrpano().get("layer").getArray();

			    const callout_logo = layer.filter((e) => {
            return e.zorder === "100000";
         });

         getKrpano().set(`layer[${callout_logo[0].name}].keep`, false);
         getKrpano().set(`layer[${callout_logo[0].name}].visible`, false);
      }
</script>
