<div id="pano" style="width:100%;height:100%;">
	<noscript><table style="width:100%;height:100%;"><tr style="vertical-align:middle;"><td><div style="text-align:center;">ERROR:<br/><br/>Javascript not activated<br/><br/></div></td></tr></table></noscript>
	<script>
		// Dang phat trien: them dau thoi gian de trinh duyet khong dung ban XML cu.
		// Truoc khi dua tour len that thi doi lai thanh  xml:"index.xml"
		// Bien giu doi tuong krpano, dung cho getKrpano() ben duoi.
		var krpano = null;

		embedpano({
			xml: "index.xml?v=" + Date.now(),
			target: "pano",
			html5: "only",
			mobilescale: 1.0,
			passQueryParameters: "startscene,startlookat,devmode",
			onready: function(kr) { krpano = kr; }
		});

		// Lay doi tuong krpano tu Javascript.
		//   getKrpano().get("xml.scene")
		//   getKrpano().set("layer[minimap_box].visible", false)
		//   getKrpano().call("loadscene(scene_matdat_01)")
		// Tra ve null neu goi truoc khi viewer san sang.
		function getKrpano() {
			if (!krpano) {
				krpano = document.getElementById("krpanoSWFObject");
			}
			return krpano || null;
		}

		// Vao toan man hinh roi khoa huong ngang.
		//
		// screen.orientation.lock CHI chay khi trang DA fullscreen. Cac truong
		// hop khong khoa duoc (deu binh thuong, khong phai loi):
		//   - iOS Safari    : khong co API nay, screen.orientation.lock undefined
		//   - May tinh      : NotSupportedError
		//   - Chrome DevTools device mode: cung la may tinh -> NotSupportedError.
		//     Muon thu that phai mo tren dien thoai that.
		//   - May da khoa xoay trong he dieu hanh: lock() bi reject
		//   - Nhung trong iframe ma trang cha thieu allowfullscreen
		//
		// Khi nhung iframe, trang cha PHAI co:
		//   <iframe src="..." allowfullscreen allow="fullscreen"></iframe>
		// May nay co the TU xoay ngang duoc khong?
		// Phai co du ca hai: vao duoc toan man hinh VA khoa duoc huong.
		// iPhone thieu ca hai (Safari chi cho <video> fullscreen), may tinh
		// thieu cai thu hai. Thieu la khong hien nut "Xoay ngang ngay" - tha
		// khong moi con hon moi roi khong lam duoc gi.
		function canAutoRotate() {
			var el = document.documentElement;
			var hasFs = !!(el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen)
			            && document.fullscreenEnabled !== false;
			var hasLock = !!(window.screen && screen.orientation && screen.orientation.lock);
			return hasFs && hasLock;
		}

		function lockLandscape() {
			var el = document.documentElement;
			var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
			if (!req) { return; }

			// Safari cu tra ve undefined thay vi Promise -> boc lai cho an toan
			Promise.resolve(req.call(el))
				.then(function () {
					if (screen.orientation && screen.orientation.lock) {
						return screen.orientation.lock("landscape");
					}
				})
				.catch(function () {
					// May khoa xoay, hoac iframe chua duoc cap quyen fullscreen.
					// Khong lam gi them - lop nhac van con de nguoi dung tu xoay.
				});
		}

		// bao cho krpano biet co nen hien nut tu xoay khong
		whenKrpanoReady(function (kr) {
			kr.set("can_autorotate", canAutoRotate());
		});

		function whenKrpanoReady(fn) {
			if (getKrpano()) { fn(getKrpano()); return; }
			var t = setInterval(function () {
				if (getKrpano()) { clearInterval(t); fn(getKrpano()); }
			}, 100);
		}
	</script>
