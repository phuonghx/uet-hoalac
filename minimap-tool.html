<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cắm điểm minimap — VR360 ĐHQGHN Hòa Lạc</title>
<style>
  :root{
    --bg:#12161c; --panel:#1a212a; --panel2:#222b36; --line:#33404f;
    --tx:#e6edf5; --tx2:#93a4b8; --acc:#4FC3F7; --ok:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;height:100vh;overflow:hidden}

  /* ---------- sidebar ---------- */
  #side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  #side h1{margin:0;padding:14px 16px 10px;font-size:15px;border-bottom:1px solid var(--line)}
  #side h1 small{display:block;color:var(--tx2);font-weight:400;font-size:12px;margin-top:2px}

  #prog{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
  #bar{height:6px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}
  #bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:9px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--tx2);cursor:pointer;font-size:12px}
  #tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}

  #list{flex:1;overflow-y:auto}
  .row{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
       border-bottom:1px solid #232c37}
  .row:hover{background:var(--panel2)}
  .row.sel{background:#1d3a4d;box-shadow:inset 3px 0 0 var(--acc)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4a5666;flex:none}
  .row.done .dot{background:var(--ok)}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .co{font:11px ui-monospace,Consolas,monospace;color:var(--tx2)}

  #side footer{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}

  /* ---------- main ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar2{padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
        display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #stage{flex:1;overflow:auto;background:#0b0e12;padding:20px;display:flex}
  #wrap{margin:auto;position:relative;box-shadow:0 8px 30px #0008}
  canvas{display:block;cursor:crosshair;image-rendering:auto}

  button,select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
                border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;font-family:inherit}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#06222e;border-color:var(--acc);font-weight:600}
  label{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
  input[type=range]{width:150px;accent-color:var(--acc)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:4px;padding:1px 5px;font:11px ui-monospace,Consolas,monospace}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
  #modal.on{display:flex}
  #box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       width:min(860px,92vw);max-height:86vh;display:flex;flex-direction:column}
  #box header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;
              justify-content:space-between;align-items:center}
  #box .body{padding:14px 16px;overflow:auto}
  textarea{width:100%;height:340px;background:#0d1117;color:#cfe9ff;border:1px solid var(--line);
           border-radius:6px;padding:10px;font:12px/1.55 ui-monospace,Consolas,monospace;resize:vertical}
  .hint{color:var(--tx2);font-size:12px;margin:0 0 10px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);
         color:#04220f;padding:8px 18px;border-radius:20px;font-weight:600;font-size:13px;
         opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.on{opacity:1}
</style>
</head>
<body>

<div id="side">
  <h1>Cắm điểm minimap<small>Bấm scene bên dưới rồi bấm lên sơ đồ</small></h1>
  <div id="prog"><span id="ptx"></span><div id="bar"><i id="pbar"></i></div></div>
  <div id="tabs">
    <button data-g="matdat" class="on">Mặt đất</button>
    <button data-g="trencao">Trên cao</button>
    <button data-g="all">Tất cả</button>
  </div>
  <div id="list"></div>
  <footer>
    <button class="pri" id="bExport">Xuất XML</button>
    <button id="bImport">Nhập XML</button>
    <button id="bReset">Xoá hết</button>
  </footer>
</div>

<div id="main">
  <div id="bar2">
    <label>Thu phóng
      <select id="zoom">
        <option value="1" selected>100%</option><option value="1.5">150%</option>
        <option value="2">200%</option><option value="3">300%</option>
        <option value="4">400%</option>
      </select>
    </label>
    <label>Hướng nón <input type="range" id="head" min="0" max="359" value="0"><b id="headv">0°</b></label>
    <label><input type="checkbox" id="auto" checked> Tự sang điểm kế tiếp</label>
    <span style="color:var(--tx2);font-size:12px">
      <kbd>←→↑↓</kbd> dịch 1px · <kbd>Shift</kbd> 10px · <kbd>[</kbd> <kbd>]</kbd> xoay nón
    </span>
  </div>
  <div id="stage"><div id="wrap"><canvas id="cv"></canvas></div></div>
</div>

<div id="modal"><div id="box">
  <header><b id="mtitle"></b><button id="mclose">Đóng</button></header>
  <div class="body">
    <p class="hint" id="mhint"></p>
    <textarea id="mtx" spellcheck="false"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="pri" id="mcopy">Copy</button>
      <button id="mload" style="display:none">Nạp vào công cụ</button>
    </div>
  </div>
</div></div>

<div id="toast"></div>

const LS = "minimap_spots_dhqghn_v4";

// ---- khôi phục phiên trước ----
try{
  const sv = JSON.parse(localStorage.getItem(LS) || "null");
  if (sv) SPOTS.forEach(s => { const o = sv[s.scene]; if (o){ s.x=o.x; s.y=o.y; s.heading=o.heading; s.placed=o.placed; } });
}catch(e){}

const RDOT = Math.max(7, Math.round(IMG_W/70));   // ban kinh cham, theo be rong anh
let group = "matdat", sel = null, zoom = 1, drag = null;

const img = new Image();
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const $ = id => document.getElementById(id);

img.onload = () => { resize(); render(); };
img.src = IMG_SRC;

function visible(){ return group==="all" ? SPOTS : SPOTS.filter(s=>s.group===group); }
function save(){
  const o = {}; SPOTS.forEach(s => o[s.scene] = {x:s.x, y:s.y, heading:s.heading, placed:!!s.placed});
  try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){}
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1400); }

function resize(){ cv.width = IMG_W*zoom; cv.height = IMG_H*zoom; }

// krpano (gốc ở tâm ảnh)  <->  canvas pixel
const toCv = (x,y) => [ (x + IMG_W/2)*zoom, (y + IMG_H/2)*zoom ];
const toKr = (px,py) => [ Math.round(px/zoom - IMG_W/2), Math.round(py/zoom - IMG_H/2) ];

function render(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.drawImage(img,0,0,cv.width,cv.height);

  for (const s of visible()){
    const [px,py] = toCv(s.x,s.y);
    const on = s === sel;

    if (on){                                  // nón hướng nhìn
      const R = RDOT*5.5*zoom, half = 30*Math.PI/180;
      const a = (s.heading-90)*Math.PI/180;
      cx.beginPath(); cx.moveTo(px,py);
      cx.arc(px,py,R,a-half,a+half); cx.closePath();
      cx.fillStyle="rgba(74,74,74,.42)"; cx.fill();
      cx.strokeStyle="#222"; cx.lineWidth=1.5; cx.stroke();
    }

    cx.globalAlpha = s.placed ? 1 : .45;      // chưa cắm thì mờ
    const r = (on ? RDOT*1.3 : RDOT) * zoom;
    cx.beginPath(); cx.arc(px,py,r,0,7);
    cx.fillStyle = on ? "#4FC3F7" : (s.group==="trencao" ? "#fbbf24" : "#ef4444");
    cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; cx.stroke();
    cx.globalAlpha = 1;

    {
      const t = s.title, fs = Math.max(11, Math.round(RDOT*0.62*zoom));
      cx.font = "600 "+fs+"px system-ui,sans-serif";
      const w = cx.measureText(t).width, pad = fs*0.4;
      cx.fillStyle="rgba(0,0,0,.72)";
      cx.fillRect(px-w/2-pad, py-r-fs*1.75, w+pad*2, fs*1.35);
      cx.fillStyle="#fff"; cx.textAlign="center";
      cx.fillText(t, px, py-r-fs*0.72);
    }
  }
}

function drawList(){
  const L = $("list"); L.innerHTML = "";
  for (const s of visible()){
    const d = document.createElement("div");
    d.className = "row" + (s===sel?" sel":"") + (s.placed?" done":"");
    d.innerHTML = '<span class="dot"></span><span class="nm">'+s.title+
                  '</span><span class="co">'+s.x+','+s.y+
                  (s.heading? ' · '+Math.round(s.heading)+'°':'')+'</span>';
    d.onclick = () => { sel = s; sync(); };
    L.appendChild(d);
  }
  const n = SPOTS.filter(s=>s.placed).length;
  $("ptx").textContent = "Đã cắm " + n + " / " + SPOTS.length;
  $("pbar").style.width = (n/SPOTS.length*100)+"%";
}

function sync(){
  if (sel){ $("head").value = ((sel.heading%360)+360)%360; $("headv").textContent = Math.round(sel.heading)+"°"; }
  drawList(); render();
}

function hit(px,py){
  let best=null, bd=1e9;
  for (const s of visible()){
    const [a,b]=toCv(s.x,s.y); const d=Math.hypot(a-px,b-py);
    if (d<bd && d < RDOT*zoom*1.15){ bd=d; best=s; }
  }
  return best;
}
function nextUnplaced(){
  const v = visible(); const i = v.indexOf(sel);
  for (let k=1;k<=v.length;k++){ const s=v[(i+k)%v.length]; if(!s.placed) return s; }
  return null;
}

// ---------- chuột ----------
cv.addEventListener("mousedown", e => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  const h = hit(px,py);
  if (h){ sel = h; drag = h; sync(); }
  else if (sel){
    [sel.x, sel.y] = toKr(px,py); sel.placed = true; save();
    if ($("auto").checked){ const nx = nextUnplaced(); if (nx) sel = nx; }
    sync();
  }
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect();
  [drag.x, drag.y] = toKr(e.clientX-r.left, e.clientY-r.top);
  drag.placed = true; sync();
});
window.addEventListener("mouseup", () => { if (drag){ drag=null; save(); } });

// ---------- bàn phím ----------
window.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName==="INPUT") return;
  if (!sel) return;
  const st = e.shiftKey ? 10 : 1;
  const M = {ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]};
  if (M[e.key]){ sel.x+=M[e.key][0]; sel.y+=M[e.key][1]; sel.placed=true; save(); sync(); e.preventDefault(); }
  if (e.key==="["){ sel.heading=(sel.heading-5+360)%360; save(); sync(); }
  if (e.key==="]"){ sel.heading=(sel.heading+5)%360;     save(); sync(); }
});

// ---------- điều khiển ----------
$("zoom").onchange = e => { zoom = +e.target.value; resize(); render(); };
$("head").oninput  = e => { if(!sel) return; sel.heading = +e.target.value; save(); sync(); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); group = b.dataset.g;
  if (sel && group!=="all" && sel.group!==group) sel=null;
  sync();
});

// ---------- xuất / nhập ----------
function xmlOut(){
  return SPOTS.map(s =>
    '\t<layer name="'+s.layer+'" style="minimap_spot"\n' +
    '\t       x="'+s.x+'" y="'+s.y+'" heading="'+Math.round(s.heading)+'" mmgroup="'+s.group+'"\n' +
    '\t       linkedscene="'+s.scene+'" spottitle="'+s.title+'" />'
  ).join("\n");
}
$("bExport").onclick = () => {
  const miss = SPOTS.filter(s=>!s.placed).length;
  $("mtitle").textContent = "Khối XML cho skin/minimap.xml";
  $("mhint").innerHTML = "Dán khối này <b>đè lên 28 dòng &lt;layer name=\"mmspot_...\"&gt;</b> trong <code>skin/minimap.xml</code>." +
      (miss ? ' <b style="color:var(--warn)">Còn '+miss+' điểm chưa cắm</b> (vẫn ở vị trí lưới mặc định).' : "");
  $("mtx").value = xmlOut(); $("mload").style.display="none"; $("modal").classList.add("on");
};
$("bImport").onclick = () => {
  $("mtitle").textContent = "Nhập lại từ XML";
  $("mhint").textContent = "Dán khối <layer name=\"mmspot_...\"> đang có trong skin/minimap.xml vào đây rồi bấm Nạp.";
  $("mtx").value = ""; $("mload").style.display="inline-block"; $("modal").classList.add("on");
};
$("mload").onclick = () => {
  const re = /name="(mmspot_[^"]+)"[\s\S]*?x="(-?\d+)"\s+y="(-?\d+)"\s+heading="([-\d.]+)"/g;
  let m, n = 0;
  while ((m = re.exec($("mtx").value))){
    const s = SPOTS.find(o => o.layer === m[1]);
    if (s){ s.x=+m[2]; s.y=+m[3]; s.heading=+m[4]; s.placed=true; n++; }
  }
  save(); sync(); $("modal").classList.remove("on"); toast("Đã nạp "+n+" điểm");
};
$("mcopy").onclick = () => {
  $("mtx").select(); document.execCommand("copy"); toast("Đã copy");
};
$("mclose").onclick = () => $("modal").classList.remove("on");
$("modal").onclick = e => { if (e.target.id==="modal") $("modal").classList.remove("on"); };
$("bReset").onclick = () => {
  if (!confirm("Xoá toàn bộ vị trí đã cắm và quay lại lưới mặc định?")) return;
  localStorage.removeItem(LS); location.reload();
};

sync();
</script>
